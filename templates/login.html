{% extends "base.html" %}

{% block title %}Login - ACT Doctor Call{% endblock %}

{% block content %}
<div class="login card">
    <h2 style="margin-top:0">ACT Doctor Call</h2>
    <p style="color:var(--muted)">Secure administrator access and demo staff login</p>

    <form method="post">
        <div style="margin-bottom:12px">
            <label>Username</label>
            <input name="username" placeholder="Username" required>
        </div>

        <div style="margin-bottom:16px">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button class="btn btn-primary" style="width:100%">Login</button>
    </form>

    <div style="margin-top:16px;font-size:13px;color:var(--muted)">
        Administrator: sign in using the configured owner credentials.<br>
        Demo staff accounts are for dummy cases only.
    </div>
</div>
{% endblock %}
